<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimRewardsModal harness（临时验证页）</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 临时 UI 验证 harness：在应用模块加载前安装假钱包（WSF 完整形态）+ RPC 拦截。
      // 场景：?s=unreg（两项都未注册）| payoutonly（仅赔付承诺已注册）| rich（两项已注册+池内有余额）
      // 安全底线：所有 starknet_addInvokeTransaction / addDeclareTransaction 一律
      // 返回 JSON-RPC 错误 —— 本页绝不可能发出真实链上交易。
      (function () {
        var scenario = new URLSearchParams(location.search).get('s') || 'payoutonly';
        var CALL_RESULT = scenario === 'unreg' ? '0x0' : '0x1';
        var BALANCE_HIT = scenario === 'rich';
        var ADDR = '0x03e1a7b2c5d8e1f4a6b1c8d4e0f3a7b2c5d9e7f2a6b1c8d4e0f3a7b2c5d8e1f4';
        var CHAIN_ID = '0x534e5f5345504f4c4941'; // SN_SEPOLIA
        window.__MOCK_ADDR = ADDR;
        var handlers = {};
        function request(c) {
          var type = c && c.type;
          if (type === 'wallet_requestAccounts') return Promise.resolve([ADDR]);
          if (type === 'wallet_requestChainId') return Promise.resolve(CHAIN_ID);
          if (type === 'wallet_supportedWalletApi') return Promise.resolve(['0.10.3', '0.7.2']);
          if (type === 'wallet_strk20Balances') {
            if (!BALANCE_HIT) {
              return Promise.reject(new Error('118 NOT_REGISTERED: no private notes for user'));
            }
            var token = (c.params && c.params.tokens && c.params.tokens[0]) || '0x0';
            return Promise.resolve([{ token: token, balance: '2500000000000000000' }]);
          }
          return Promise.reject(new Error('mock wallet: unsupported type ' + type));
        }
        var wallet = {
          id: 'ready',
          name: 'MockReady',
          version: '5.28.0',
          supportedWalletApi: function () {
            return Promise.resolve(['0.10.3', '0.7.2']);
          },
          request: request,
          on: function (event, cb) { (handlers[event] = handlers[event] || []).push(cb); },
          off: function (event, cb) {
            handlers[event] = (handlers[event] || []).filter(function (f) { return f !== cb; });
          },
          features: {
            'starknet:walletApi': { request: request },
            'standard:events': {
              on: function (event, cb) { (handlers[event] = handlers[event] || []).push(cb); },
              off: function (event, cb) {
                handlers[event] = (handlers[event] || []).filter(function (f) { return f !== cb; });
              },
            },
            'standard:connect': {
              connect: function () {
                return Promise.resolve({ accounts: [ADDR], chainId: CHAIN_ID });
              },
            },
          },
        };
        window.starknet_ready = wallet;
        window.starknet_argentX = wallet;
        var origFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          try {
            var body = init && typeof init.body === 'string' ? init.body : '';
            if (body.indexOf('"jsonrpc"') !== -1) {
              var req = JSON.parse(body);
              var id = req.id;
              var ok = function (result) {
                return Promise.resolve(
                  new Response(JSON.stringify({ jsonrpc: '2.0', id: id, result: result }), {
                    headers: { 'content-type': 'application/json' },
                  }),
                );
              };
              if (req.method === 'starknet_chainId') return ok(CHAIN_ID);
              if (req.method === 'starknet_specVersion') return ok('0.7.1');
              if (req.method === 'starknet_blockNumber') return ok(1000);
              if (req.method === 'starknet_call') return ok([CALL_RESULT]);
              if (
                req.method === 'starknet_addInvokeTransaction' ||
                req.method === 'starknet_addDeclareTransaction'
              ) {
                return Promise.resolve(
                  new Response(
                    JSON.stringify({
                      jsonrpc: '2.0',
                      id: id,
                      error: { code: 40, message: 'harness: invokes are blocked' },
                    }),
                    { headers: { 'content-type': 'application/json' } },
                  ),
                );
              }
              return ok(null);
            }
          } catch (e) {
            /* 非 JSON-RPC 请求 → 原样放行 */
          }
          return origFetch(input, init);
        };
      })();
    </script>
    <script type="module" src="/src/dev/ClaimHarness.tsx"></script>
  </body>
</html>
