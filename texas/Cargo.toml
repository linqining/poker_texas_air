[package]
name = "texas"
version = "0.2.0"
edition = "2024"
license = "BUSL-1.1"
description = "Secret poker game server: socket.io game loop + Starknet settlement (STRK20 RFP-03)"

[dependencies]
hand-verify-native = { path = "../poker_contracts/hand-verify-native" }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
socketioxide = { version = "0.18.3", features = ["state"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# json feature：Starknet JSON-RPC 调用需要 serde_json 序列化请求体。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
itertools = "0.14"
hex = "0.4"

# ===== 工作区内协议栈（单一真源）=====
# Plan D（2026-09-05）：Stark 曲线唯一世界；legacy-bls381/blst 已移除。
poker_protocol = { path = "../poker_protocol", features = ["borsh", "stark-curve"] }
poker_l1 = { path = "../poker_l1" }
poker_texas_air = { path = ".." }
poker-protocol-core = { path = "../poker-protocol-core" }
# 注：镜像层的 ptx_protocol 别名已改为在 mirror.rs 内 `use poker_protocol as ptx_protocol;`
# （cargo 不允许同一路径依赖以不同名字出现两次）。

# --- Starknet 链上交互 ---
starknet = "0.17"
url = "2"
clap = { version = "4", features = ["derive"] }
borsh = "1.5"
# Poseidon（Plan D v2 reveal_commitment + settlement digest 重算）。
# 全仓统一 0.8：Felt = starknet-types-core Felt，与 starknet 0.17 的
# types::Felt、poker_texas_air / hand-verify-native 的公开类型同一实例，
# 无跨 Felt 桥。Poseidon 规格跨版本一致（golden vectors 自证）。
starknet-crypto = { workspace = true }
# STARK 曲线参数（BETA）：0.6 的 API 即 types-core Felt（纯常量表，与
# Felt 迁移无关）；types-core 按需直接引用（dual_settle 的点解析）。
starknet-curve = "0.6"
starknet-types-core = { workspace = true }
rand_core = "0.6"

[features]
default = []

[[bin]]
name = "snops"
path = "src/bin/snops.rs"
