<!DOCTYPE html>
<html lang="[[LANG]]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="[[DESCRIPTION]]">
<title>[[TITLE]]</title>
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
<script>
/* 首帧前定底面，避免纸白→夜场的闪白。默认跟随系统偏好，用户手动切换后记住选择。 */
(function () {
  var d = document.documentElement;
  // 优先级：标记里显式写死的 data-ground > 用户上次选择 > 系统偏好。
  // 显式属性优先这条也让 website/tools/site_shoot.py 能强制出某一底面的图。
  if (d.hasAttribute("data-ground")) return;
  try {
    var saved = localStorage.getItem("zchain-ground");
    d.setAttribute("data-ground", saved ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper"));
  } catch (e) { d.setAttribute("data-ground", "paper"); }
})();
</script>
</head>
<body class="docs-body">
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header">
  <div class="wrap header-row">
    <p class="brand">
      <a href="/" class="brand-link"><img src="/assets/img/logo.svg" alt="ZChain Poker 标志" width="30" height="30"><span>ZChain&nbsp;Poker</span></a>
    </p>
    <nav class="site-nav" aria-label="站点导航">[[NAV]]</nav>
    <button type="button" class="ground-toggle" data-ground-toggle aria-label="切换纸白/夜场底面">
      <span class="ground-toggle-label"></span>
    </button>
  </div>
</header>
[[ENV_STRIP]]
<div class="wrap docs-layout">
  [[SIDEBAR]]
  <main id="main" class="docs-main">
    <div class="page-head">
      <p class="docs-kicker">ZChain Poker 文档 &#183; [[FOOTER_VERSION]]</p>
      <h1 class="page-title">[[PAGE_TITLE]]</h1>
      [[BREADCRUMB]]
      <p class="page-lead">[[PAGE_LEAD]]</p>
    </div>
    [[BANNERS]]
    <div class="page-body">
[[BODY]]
    </div>
    <p class="docs-footer-note">[[FOOTER_VERSION]] &#183; <code>latest</code> 指向已发布 release，草案进入 <code>next</code>；见<a href="/docs/changelog/versioning/">版本说明</a>。</p>
  </main>
</div>
[[FOOTER]]
<script src="/assets/js/ground.js" defer></script>
</body>
</html>
