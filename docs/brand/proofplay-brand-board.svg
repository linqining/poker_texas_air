<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ProofPlay / 明局品牌方向板</title>
  <desc id="desc">面向可验证游戏平台的母品牌视觉、色彩、品牌架构和产品组件方向。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 2.2px; }
      .small { font-size: 15px; }
      .body { font-size: 18px; }
      .muted { fill: #93a29a; }
      .ink { fill: #101512; }
      .paper { fill: #f3f0e7; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#101512"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <text x="72" y="64" class="mono label" fill="#18a66a">PROOFPLAY BRAND DIRECTION / 2026.09</text>
  <text x="1528" y="64" text-anchor="end" class="mono small muted">VERIFIABLE GAMES / ENGLISH-FIRST MASTERBRAND</text>
  <line x1="72" y1="86" x2="1528" y2="86" stroke="#314139"/>
  <g transform="translate(72 138)">
    <g transform="translate(0 4)">
      <path d="M18 12 H42 M18 12 V72 M18 72 H42 M78 12 H54 M78 12 V72 M78 72 H54" fill="none" stroke="#18a66a" stroke-width="12" stroke-linecap="square"/>
      <rect x="41" y="-6" width="14" height="14" transform="rotate(45 48 1)" fill="#f3f0e7"/>
      <path d="M30 48 L44 62 L70 36" fill="none" stroke="#f3f0e7" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>
    <text x="126" y="75" class="sans" font-size="78" font-weight="850" letter-spacing="-2" fill="#f3f0e7">Proof</text>
    <text x="331" y="75" class="sans" font-size="78" font-weight="850" letter-spacing="-2" fill="#18a66a">Play</text>
    <text x="130" y="112" class="sans" font-size="25" font-weight="700" letter-spacing="9" fill="#93a29a">明 局</text>
    <text x="0" y="180" class="sans" font-size="44" font-weight="750" fill="#f3f0e7">The game proves itself.</text>
    <text x="0" y="222" class="sans" font-size="27" font-weight="650" fill="#93a29a">游戏自己证明公平。</text>
  </g>
  <g transform="translate(925 132)">
    <rect width="603" height="238" rx="8" fill="#17201b" stroke="#314139"/>
    <rect width="6" height="238" fill="#18a66a"/>
    <text x="34" y="42" class="mono label" fill="#18a66a">BRAND PROMISE</text>
    <text x="34" y="87" class="sans" font-size="25" font-weight="720" fill="#f3f0e7">Proof, not promises.</text>
    <text x="34" y="126" class="sans body muted">Private where it matters.</text>
    <text x="34" y="158" class="sans body muted">Fast enough to disappear.</text>
    <text x="34" y="190" class="sans body muted">Rules above the house.</text>
  </g>
  <g transform="translate(72 430)">
    <text x="0" y="0" class="mono label" fill="#93a29a">CORE PALETTE</text>
    <g transform="translate(0 24)"><rect width="218" height="114" fill="#f3f0e7"/><text x="18" y="75" class="mono small ink">PAPER</text><text x="18" y="96" class="mono small ink">#F3F0E7</text></g>
    <g transform="translate(230 24)"><rect width="218" height="114" fill="#18a66a"/><text x="18" y="75" class="mono small paper">VERIFY</text><text x="18" y="96" class="mono small paper">#18A66A</text></g>
    <g transform="translate(460 24)"><rect width="218" height="114" fill="#4967f2"/><text x="18" y="75" class="mono small paper">SIGNAL</text><text x="18" y="96" class="mono small paper">#4967F2</text></g>
    <g transform="translate(690 24)"><rect width="218" height="114" fill="#d49a2a"/><text x="18" y="75" class="mono small ink">EVIDENCE</text><text x="18" y="96" class="mono small ink">#D49A2A</text></g>
  </g>
  <g transform="translate(1040 430)">
    <text x="0" y="0" class="mono label" fill="#93a29a">BRAND ARCHITECTURE</text>
    <rect x="0" y="24" width="488" height="114" rx="6" fill="#f3f0e7"/>
    <text x="24" y="69" class="sans" font-size="26" font-weight="800" fill="#101512">ProofPlay</text>
    <text x="24" y="99" class="sans body" fill="#465149">Poker · Proof · Protocol · Wallet</text>
    <text x="24" y="123" class="mono small" fill="#6c776f">ONE MASTERBRAND, MANY GAMES</text>
  </g>
  <g transform="translate(72 642)">
    <text x="0" y="0" class="mono label" fill="#93a29a">SIGNATURE PRODUCT ASSET / ROUND RECEIPT</text>
    <rect x="0" y="26" width="870" height="276" rx="8" fill="#f3f0e7"/>
    <rect x="0" y="26" width="8" height="276" fill="#18a66a"/>
    <text x="34" y="70" class="mono label" fill="#5b675f">ROUND #10482 / PROOFPLAY POKER</text>
    <line x1="34" y1="89" x2="836" y2="89" stroke="#c8c4b9"/>
    <text x="34" y="128" class="mono body ink">SHUFFLE</text><text x="810" y="128" text-anchor="end" class="mono body" fill="#087d4c">VERIFIED</text>
    <text x="34" y="166" class="mono body ink">PRIVATE DEAL</text><text x="810" y="166" text-anchor="end" class="mono body" fill="#087d4c">VERIFIED</text>
    <text x="34" y="204" class="mono body ink">ACTIONS</text><text x="810" y="204" text-anchor="end" class="mono body" fill="#4967f2">BOUND</text>
    <text x="34" y="242" class="mono body ink">SETTLEMENT</text><text x="810" y="242" text-anchor="end" class="mono body" fill="#087d4c">VERIFIED ON STARKNET</text>
    <line x1="34" y1="260" x2="836" y2="260" stroke="#c8c4b9"/>
    <text x="34" y="287" class="mono small" fill="#5b675f">VERIFY INDEPENDENTLY → /PROOF/10482</text>
  </g>
  <g transform="translate(988 642)">
    <text x="0" y="0" class="mono label" fill="#93a29a">PLAYER-FACING COPY</text>
    <rect x="0" y="26" width="540" height="276" rx="8" fill="#17201b" stroke="#314139"/>
    <text x="30" y="78" class="sans" font-size="30" font-weight="780" fill="#f3f0e7">不信发牌，</text>
    <text x="30" y="118" class="sans" font-size="30" font-weight="780" fill="#f3f0e7">验证每一手。</text>
    <text x="30" y="164" class="sans body muted">牌面保持私密，洗牌与结算留下证据。</text>
    <rect x="30" y="196" width="168" height="48" rx="4" fill="#18a66a"/>
    <text x="114" y="227" text-anchor="middle" class="sans body" font-weight="750" fill="#07110c">开始游戏</text>
    <rect x="212" y="196" width="198" height="48" rx="4" fill="none" stroke="#60736a"/>
    <text x="311" y="227" text-anchor="middle" class="sans body" font-weight="700" fill="#f3f0e7">验证一手牌</text>
  </g>
  <line x1="72" y1="968" x2="1528" y2="968" stroke="#314139"/>
  <text x="72" y="990" class="mono small" fill="#66756d">VISUAL DIRECTION ONLY — FINAL NAME REQUIRES TRADEMARK, DOMAIN AND NATIVE-LANGUAGE CLEARANCE</text>
</svg>
