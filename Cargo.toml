[package]
name = "poker_texas_air"
version = "0.1.0"
edition = "2024"
description = "Texas Poker method AIR and custom-circuit proving primitives"
license = "BUSL-1.1"

[lints.rust]
# CI sets RUSTFLAGS='--cfg=texas_release_tests' (see .github/workflows/ci.yml);
# declare it so local builds don't warn about an unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(texas_release_tests)'] }

[workspace]
resolver = "2"
exclude = ["third_party", "third_party/flock", "third_party/flock/crates/flock-core", "third_party/flock/crates/flock-prover", "third_party/flock/crates/flock-cuda-ffi", "fuzz"]
members = [
    ".",
    "hand-bench",
    "poker_contracts/hand-verify-native",
    "poker_l1",
    "vm-common",
    "poker_protocol",
    "poker-protocol-core",
    "poker-protocol-proofs",
    "poker-protocol-abi",
    "poker-protocol-bg",
    "texas",
]

[workspace.dependencies]
poker_protocol = { path = "poker_protocol", features = ["borsh", "ristretto-air"] }
poker-protocol-core = { path = "poker-protocol-core" }
poker-protocol-bg = { path = "poker-protocol-bg" }
rand_core = "0.6.4"
vm-common = { path = "vm-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1.6"
borsh = { version = "1.7", features = ["derive"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
blake2 = "0.10.6"
hex = "0.4.3"
thiserror = "1.0.61"
rand = "0.8.5"
secp256k1 = { version = "0.29", features = ["recovery", "rand", "global-context"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
subtle = "2.5"
rocksdb = { version = "0.22", default-features = false }
solana_rbpf = "0.8"
group = "0.13"
chacha20poly1305 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
rayon = "1"
proptest = "1"
stwo = { version = "2.3", features = ["parallel", "prover"] }
stwo-constraint-framework = { version = "2.3", features = ["prover"] }
starknet-ff = { version = "0.3", features = ["serde"] }
starknet-crypto = { version = "0.6", default-features = false, features = ["alloc"] }
bincode = "1"

[lib]
path = "src/lib.rs"

[features]
default = []
# 保留 Aggregator PoC 配置；生产 prove/verify 默认拒绝 descriptor-only 聚合
aggregator = []
# 测试辅助：暴露不可信负向测试工具；lib.rs 禁止其进入 release 构建
test-helpers = []

[dependencies]
# 跨池死锁 tripwire 报警（blake3_flock::on_flock_pool 自检日志）
tracing = "0.1"
# ===== 工作区内复用 =====
poker_l1 = { path = "poker_l1" }
poker_protocol = { workspace = true }
poker-protocol-core = { workspace = true }
poker-protocol-bg = { workspace = true }
rand_core = { workspace = true }
vm-common = { path = "vm-common" }
# ===== Stwo 证明后端 =====
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true }
# Poseidon252 哈希（state_root 用）— 必须与 Stwo 同版本（0.6.x），
# 否则 starknet_crypto::poseidon_hash_many 的 Felt 类型与
# starknet_ff::FieldElement 不兼容。
starknet-ff = { workspace = true }
starknet-crypto = { workspace = true }
# ===== 通用依赖 =====
borsh = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake2 = { workspace = true }
num-bigint = "0.4.8"
num-traits = "0.2"
# ===== 二元域哈希证明后端（vendored flock，BLAKE3 merkle fork）=====
flock-core = { path = "third_party/flock/crates/flock-core" }
flock-prover = { path = "third_party/flock/crates/flock-prover" }
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
secp256k1 = { workspace = true }
# Bench-only: activates stwo's built-in phase spans (Composition/FRI/commit)
# behind TEXAS_STWO_TRACING in the admission attribution benchmark.
tracing-subscriber = "0.3"

# Integration tests opt into untrusted PoC entry points explicitly via
# `cargo test --features test-helpers` (debug only; the release guard in
# lib.rs rejects the feature outside the test harness).

[profile.release]
# Cross-crate LTO and a single codegen unit maximize inlining for the long
# monomorphized chains in `ristretto_fp_program_air` (6022 lines of generic
# trace/scope/witness code) and the stwo `constraint-framework` glue. On
# this workspace the measured win is ~3-8% on prove and ~2-5% on verify,
# at the cost of longer link times — release-only.
lto = "fat"
codegen-units = 1
# Strip only release/debug symbols that are not needed for `perf` /
# flamegraph attribution; keep the rest so release binaries stay
# debuggable without a second artifact.
strip = "debuginfo"

# Dev-loop build speed: full `debug = 2` DWARF was the dominant cost —
# 21 GB of deps artifacts and 200 MB+ rlibs made every link (and thus every
# `cargo test`) crawl. `line-tables-only` keeps file:line in backtraces for
# workspace code at a fraction of the size; dependencies drop debuginfo
# entirely (their frames show up symbolicated without line numbers, which is
# fine for a dev loop — `cargo test-all`/CI run in release where needed).
[profile.dev]
debug = "line-tables-only"

# Tests spend almost all their time inside dependency code — stwo's SIMD
# field math, circle FFT, FRI and Merkle commitments — which at dev
# opt-level 0 makes the poseidon252 prove tests tens of times slower.
# Optimize every dependency (including workspace members) while keeping
# this crate itself at fast-compile opt-level 0 for quick iteration.
[profile.dev.package."*"]
opt-level = 3
debug = false
