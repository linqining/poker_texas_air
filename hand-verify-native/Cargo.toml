# Standalone workspace for the native-Stwo hand_verify spike.
#
# Deliberately NOT a member of the root workspace (same pattern as
# `proving-tool/`): the root `Cargo.toml` members list does not include this
# directory, so `cargo` commands at the repo root never touch it and the main
# project build stays untouched. It has its own Cargo.lock and target dir.
#
# Purpose: evaluate the "Stark-curve sigma + native Stwo" architecture for
# hand_verify — host-native EC verification plus an O(1)-verify statement
# AIR — without the Cairo VM / stwo-cairo pipeline (which measures ~13.6s
# prove per hand at 148 EC ops on the reference M3 Pro).

[workspace]
resolver = "2"

[package]
name = "hand-verify-native"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false
description = "Native Stwo (no Cairo VM) spike for hand_verify: Stark-curve sigma host verification + O(1)-verify statement AIR"

[[bin]]
name = "hand-verify-native"
path = "src/main.rs"

[dependencies]
stwo = { version = "2.3", features = ["parallel", "prover"] }
stwo-constraint-framework = { version = "2.3", features = ["prover"] }
# Felt (field arithmetic mod P) + Poseidon (poseidon_hash_many) — same
# backend the root protocol uses, so transcripts are Cairo-replayable.
starknet-crypto = { version = "0.6", default-features = false, features = ["alloc"] }
num-bigint = "0.4.8"
rayon = "1.10"
bincode = "1"
serde_json = "1"

[profile.release]
# Keep default opt-level/codegen-units so timings stay comparable to the
# prove-hand baseline (which also uses plain release defaults).
