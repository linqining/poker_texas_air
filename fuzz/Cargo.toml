[workspace]

[package]
name = "poker-texas-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
borsh = "1.7"
poker_texas_air = { path = ".." }
poker_l1 = { path = "../poker_l1" }

[[bin]]
name = "settlement_statement"
path = "fuzz_targets/settlement_statement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "digest_felts"
path = "fuzz_targets/digest_felts.rs"
test = false
doc = false
bench = false
