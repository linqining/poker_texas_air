[package]
name = "poker_contracts"
version = "0.1.0"
edition = "2024_07"
publish = false

[dependencies]
openzeppelin = "1.0.0"
snforge_std = "0.39.0"

starknet = "2.11.4"

[cairo]
sierra-release = true

[lib]
sierra-release = true
# 主合约目标：产出 sierra+casm artifact 供 Rust 部署工具使用
[[target.starknet-contract]]
sierra = true
casm = true

# dual/hand_batch 与 secp256k1_verifier 的旧测试在 cairo 2.11.4 下触发
# 编译器 lowering crash（既有问题），门控到该 feature，默认关闭。
[features]
dual_legacy_tests = []
