[package]
name = "poker_contracts"
version = "0.1.0"
edition = "2024_07"
publish = false

[dependencies]
openzeppelin = "1.0.0"
snforge_std = "0.63.0"

starknet = "2.19.4"

[cairo]
sierra-release = true
# SNIP-36 预埋：proof_facts 消费路径（get_execution_info_v3_syscall）在
# cairo ≥2.12 的 corelib 里才可用，且该 syscall 属 libfunc 白名单之外——
# 升级编译器前先把 libfuncs 门放开（零行为变化：当前代码未用白名单外
# libfunc，仅避免后续迁移时的二次编译回归）。
allowed-libfuncs-list.name = "all"

[lib]
sierra-release = true
# 主合约目标：产出 sierra+casm artifact 供 Rust 部署工具使用
[[target.starknet-contract]]
sierra = true
casm = true

# dual/hand_batch 与 secp256k1_verifier 的旧测试在 cairo 2.11.4 下触发
# 编译器 lowering crash（既有问题），门控到该 feature，默认关闭。
[features]
dual_legacy_tests = []

[profile.dev.cairo]
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true
