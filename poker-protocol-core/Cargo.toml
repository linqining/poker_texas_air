[package]
name = "poker-protocol-core"
version = "0.1.0"
edition = "2021"
description = "Shared cryptographic primitives and native curve backends"

[features]
borsh = ["dep:borsh"]

[dependencies]
rand_core = "0.6.4"
rayon = "1.10"
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
blstrs = "0.7"
group = "0.13"
ff = "0.13"
borsh = { version = "1.5", optional = true }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
