[package]
name = "poker-protocol-core"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Shared cryptographic primitives and native curve backends"

[features]
default = ["stark-backend"]
borsh = ["dep:borsh"]
# STARK curve backend (Cairo-native EC_OP settlement route, Plan D)
stark-backend = []

[dependencies]
rand_core = "0.6.4"
rand = "0.8.5"
rayon = "1.10"
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
blstrs = "0.7"
group = "0.13"
ff = "0.13"
halo2curves = { version = "0.7", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "alloc", "precomputed-tables", "std", "expose-field", "hash2curve"] }
starknet-crypto = "0.8.1"
starknet-curve = "0.6"
starknet-types-core = { version = "0.2", default-features = false, features = ["curve", "hash"] }
crypto-bigint = "0.5.5"
borsh = { version = "1.5", optional = true }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
halo2curves = { version = "0.7", default-features = false }
poker-protocol-proofs = { path = "../poker-protocol-proofs" }
