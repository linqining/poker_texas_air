[package]
name = "poker_protocol"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "verify_browser_crypto_borsh"
required-features = ["legacy-bls381", "borsh"]

[[bin]]
name = "verify_reconstruction_v3_borsh"
required-features = ["legacy-bls381", "borsh"]

[[bin]]
name = "verify_aleo_protocol_borsh"
required-features = ["aleo-native"]

[features]
default = ["legacy-bls381"]
# Retained temporarily for the original client while its BLS12-381 / Move
# protocol is removed. Aleo-only consumers must opt out of this feature: it
# pulls `blstrs` and its C-backed `blst` dependency, which is not part of the
# native BLS12-377 protocol.
legacy-bls381 = [
    "dep:poker-protocol-core",
    "dep:poker-protocol-proofs",
    "dep:poker-protocol-abi",
    "poker-protocol-core/borsh",
    "poker-protocol-proofs/borsh",
    "dep:lazy_static",
    "dep:curve25519-dalek",
    "dep:sha2",
    "dep:tracing",
    "dep:serde",
    "dep:serde_json",
    "dep:halo2curves",
    "dep:rayon",
    "dep:merlin",
    "dep:blstrs",
    "dep:group",
    "dep:ff",
]
borsh = ["dep:borsh", "dep:snarkvm-console"]
# Native Aleo type conversion used by the proving service and non-WASM clients.
# Keep this separate from the target-specific console WASM mode: enabling that
# mode globally makes native snarkvm synthesizer test dependencies select an
# incompatible proving-key API.
aleo-native = ["borsh"]
# Browser consumers opt in explicitly so their target still selects snarkvm's
# WASM implementation without contaminating native workspace builds.
aleo-wasm = ["aleo-native", "snarkvm-console/wasm"]
[dependencies]
poker-protocol-core = { path = "../poker-protocol-core", optional = true }
poker-protocol-proofs = { path = "../poker-protocol-proofs", optional = true }
poker-protocol-abi = { path = "../poker-protocol-abi", optional = true }
rand_core = "0.6.4"
rand = "0.8.5"
lazy_static = { version = "1.4.0", optional = true }
curve25519-dalek = { version = "4.1.3", features = ["rand_core"], optional = true }
sha2 = { version = "0.10.8", optional = true }
sha3 = "0.10.8"
hex = "0.4"
tracing = { version = "0.1", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
halo2curves = { version = "0.7", optional = true }
rayon = { version = "1.10", optional = true }
merlin = { version = "3", optional = true }
blstrs = { version = "0.7", optional = true }
group = { version = "0.13", optional = true }
ff = { version = "0.13", optional = true }
borsh = { version = "1.5", features = ["derive"], optional = true }
# The Aleo-native mental-poker path uses the exact public `group` and `scalar`
# types consumed by the Varuna settlement circuit. These are the prime-order
# Edwards subgroup over Aleo's BLS12-377 environment, not a byte adapter for
# the legacy BLS12-381 protocol.
snarkvm-console = { version = "=4.7.3", default-features = false, features = ["network", "types"], optional = true }
